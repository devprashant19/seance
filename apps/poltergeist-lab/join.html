<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Join the Séance</title>
    <meta name="description" content="Connect your phone to the Séance: possess the ghost, run physics experiments, sing in the Banshee Choir." />
    <meta name="theme-color" content="#090310" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%91%BB%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&display=swap" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      :root { --cyan: #00ffff; --pink: #ff00ff; --yellow: #ffff00; --green: #00ff99; --muted: #b4a9d6; --line: rgba(0,255,255,0.25); }
      body {
        min-height: 100vh; color: #f2ecff; font-family: Rajdhani, system-ui, sans-serif; font-size: 17px;
        background-color: #090310;
        background-image:
          radial-gradient(circle at 50% 30%, rgba(40,10,70,0) 0%, rgba(9,3,16,0.9) 85%),
          linear-gradient(to right, rgba(255,0,255,0.06) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0,255,255,0.06) 1px, transparent 1px),
          radial-gradient(ellipse at top, #2a0a3b 0%, #090310 70%);
        background-size: 100% 100%, 40px 40px, 40px 40px, 100% 100%;
        background-attachment: fixed;
      }
      .wrap { max-width: 420px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
      .kicker { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--pink); text-shadow: 0 0 8px rgba(255,0,255,0.7); }
      h1 { font-family: "Press Start 2P", monospace; font-weight: 400; font-size: 17px; line-height: 1.5; text-shadow: 0 0 6px var(--cyan), 0 0 18px rgba(0,255,255,0.6); }
      .room { color: var(--muted); }
      .code { font-family: "Press Start 2P", monospace; color: var(--yellow); letter-spacing: 4px; text-shadow: 0 0 6px var(--yellow); font-size: 15px; }
      .box { position: relative; width: 100%; border: 1px solid var(--cyan); background: rgba(16,6,30,0.86); box-shadow: 0 0 10px rgba(0,255,255,0.3), inset 0 0 20px rgba(0,255,255,0.08); }
      .box::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 18px; height: 18px; border-right: 2px solid var(--pink); border-bottom: 2px solid var(--pink); pointer-events: none; }
      form.box { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
      label { color: var(--muted); font-size: 15px; }
      input { width: 100%; padding: 12px; font: 600 20px Rajdhani, sans-serif; letter-spacing: 2px; text-align: center; text-transform: uppercase; color: #fff; background: rgba(10,5,20,0.9); border: 1px solid var(--line); }
      input:focus { outline: 2px solid var(--pink); }
      .btn { position: relative; overflow: hidden; padding: 15px 18px; font: 12px "Press Start 2P", monospace; text-transform: uppercase; color: #fff; border: none; cursor: pointer;
        background: linear-gradient(180deg, rgba(255,0,255,0.25) 0%, rgba(80,0,80,0.55) 100%); box-shadow: inset 0 0 0 2px var(--pink), 0 0 12px var(--pink); }
      .btn:disabled { filter: grayscale(1); opacity: 0.5; }
      .btn:active { transform: translateY(2px); }
      .ghost { height: 240px; padding: 0; }
      .ghost-fallback { height: 100%; display: flex; align-items: center; justify-content: center; font: 10px "Press Start 2P", monospace; color: var(--cyan); }
      .hello { font: 12px "Press Start 2P", monospace; color: var(--green); text-shadow: 0 0 8px rgba(0,255,153,0.6); line-height: 1.6; }
      .pad { width: 100%; height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 11px "Press Start 2P", monospace;
        color: var(--pink); border: 2px dashed rgba(255,0,255,0.55); background: rgba(255,0,255,0.07); touch-action: none; user-select: none; -webkit-user-select: none; }
      .pad small { font: 13px Rajdhani, sans-serif; color: var(--muted); }
      .pad.active { border-style: solid; background: rgba(255,0,255,0.3); box-shadow: 0 0 18px var(--pink); }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
      .ins { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; text-align: left; cursor: pointer;
        font: 600 15px Rajdhani, sans-serif; color: var(--cyan); background: rgba(0,255,255,0.05); border: 1px solid var(--line); }
      .ins small { font-size: 12px; color: var(--muted); font-weight: 500; }
      .ins[aria-checked="true"] { color: #fff; border-color: var(--pink); box-shadow: 0 0 12px rgba(255,0,255,0.55); }
      .ins:disabled { opacity: 0.4; }
      .status { color: var(--muted); font-size: 15px; max-width: 360px; }
      .hint { color: var(--muted); font-size: 14px; }
      .trouble { width: 100%; padding: 14px; text-align: left; font-size: 15px; color: #ffb3d1; background: rgba(255,59,141,0.1); border: 1px solid rgba(255,59,141,0.5); }
      [hidden] { display: none !important; }
      @media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
    </style>
  </head>
  <body>
    <main id="join-app" class="wrap">
      <p class="kicker">Séance · Possession link</p>
      <h1>JOIN THE SÉANCE</h1>
      <p class="room">Room <span id="room-code-label" class="code">----</span></p>

      <form id="name-form" class="box" autocomplete="on">
        <label for="name-input">Your name — it floats above your ghost on the laptop</label>
        <input id="name-input" name="nickname" maxlength="24" placeholder="PLAYER 1" autocomplete="nickname" enterkeyhint="go" />
        <button id="begin-btn" class="btn" type="submit" disabled>Join the séance</button>
      </form>

      <section id="live" hidden style="width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center">
        <p id="hello" class="hello"></p>
        <div id="ghost-box" class="box ghost" role="img" aria-label="Your 3D ghost. Shake the phone to make it dizzy."></div>
        <p class="hint">Shake your phone to make the ghost dizzy 🌀</p>
        <div id="sing-pad" class="pad" role="button" aria-label="Hold to sing in the Banshee Choir">🎤 HOLD TO SING<small>(when the laptop is on the Banshee Choir)</small></div>
        <p id="instr-status" class="hint">Choir instrument — switch any time (10 s cooldown)</p>
        <div id="instr-grid" class="grid" role="radiogroup" aria-label="Choir instrument"></div>
      </section>

      <p id="status-text" class="status" role="status">Type your name, then tap Join.</p>
      <div id="trouble-box" class="trouble" hidden></div>
    </main>
    <script type="module" src="/src/join-standalone.ts"></script>
  </body>
</html>
